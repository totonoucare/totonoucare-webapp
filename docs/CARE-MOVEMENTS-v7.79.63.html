<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ほぐしの一手18種類</title><style>body{font-family:system-ui,sans-serif;color:#61536d;background:#f8f6fa;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:1100px}figure{margin:0;background:white;padding:16px;border-radius:18px}figcaption{font-weight:700;margin-bottom:8px}img{display:block;width:100%;height:auto}</style><h1>ほぐしの一手 · 全18種類</h1><p>紫の矢印は動かす向き、緑は手を当てる場所です。</p><main><figure><figcaption>肩の下から手首の小指側へなでる</figcaption><img src="../public/care-movements/line-heart-si-little-finger-stroke.svg" alt="肩の下から手首の小指側へなでる"></figure><figure><figcaption>肩甲骨の外側へ届く範囲で手を当てる</figcaption><img src="../public/care-movements/line-heart-si-scapula-contact.svg" alt="肩甲骨の外側へ届く範囲で手を当てる"></figure><figure><figcaption>肩を後ろへ小さく5回回す</figcaption><img src="../public/care-movements/line-heart-si-shoulder-roll.svg" alt="肩を後ろへ小さく5回回す"></figure><figure><figcaption>ふくらはぎの後ろを膝下から足首へなでる</figcaption><img src="../public/care-movements/line-kidney-bl-calf-stroke.svg" alt="ふくらはぎの後ろを膝下から足首へなでる"></figure><figure><figcaption>腰の左右へ手のひらを当てる</figcaption><img src="../public/care-movements/line-kidney-bl-low-back-contact.svg" alt="腰の左右へ手のひらを当てる"></figure><figure><figcaption>かかとを床につけてつま先を上げる</figcaption><img src="../public/care-movements/line-kidney-bl-toe-lift.svg" alt="かかとを床につけてつま先を上げる"></figure><figure><figcaption>腰骨の下から膝の外側へなでる</figcaption><img src="../public/care-movements/line-liver-gb-outer-thigh-stroke.svg" alt="腰骨の下から膝の外側へなでる"></figure><figure><figcaption>座って上体を左右へ小さく倒す</figcaption><img src="../public/care-movements/line-liver-gb-side-bend.svg" alt="座って上体を左右へ小さく倒す"></figure><figure><figcaption>脇腹に手を当てて左右5呼吸</figcaption><img src="../public/care-movements/line-liver-gb-side-breath.svg" alt="脇腹に手を当てて左右5呼吸"></figure><figure><figcaption>椅子に座り胸に手を置いて6呼吸</figcaption><img src="../public/care-movements/line-lung-li-chest-breath.svg" alt="椅子に座り胸に手を置いて6呼吸"></figure><figure><figcaption>鎖骨の下を胸の中央側から肩先へなでる</figcaption><img src="../public/care-movements/line-lung-li-clavicle-stroke.svg" alt="鎖骨の下を胸の中央側から肩先へなでる"></figure><figure><figcaption>前腕の親指側をひじから手首へなでる</figcaption><img src="../public/care-movements/line-lung-li-thumb-forearm-stroke.svg" alt="前腕の親指側をひじから手首へなでる"></figure><figure><figcaption>前腕の手のひら側をひじから手首へなでる</figcaption><img src="../public/care-movements/line-pc-sj-inner-forearm-stroke.svg" alt="前腕の手のひら側をひじから手首へなでる"></figure><figure><figcaption>前腕の手の甲側を手首からひじへなでる</figcaption><img src="../public/care-movements/line-pc-sj-outer-forearm-stroke.svg" alt="前腕の手の甲側を手首からひじへなでる"></figure><figure><figcaption>ひじを体の横へつけて手首を小さく回す</figcaption><img src="../public/care-movements/line-pc-sj-wrist-circle.svg" alt="ひじを体の横へつけて手首を小さく回す"></figure><figure><figcaption>あお向けで膝を立てお腹に手を置いて6呼吸</figcaption><img src="../public/care-movements/line-spleen-st-abdominal-breath.svg" alt="あお向けで膝を立てお腹に手を置いて6呼吸"></figure><figure><figcaption>座って片脚の膝をゆっくり伸ばして戻す</figcaption><img src="../public/care-movements/line-spleen-st-knee-extension.svg" alt="座って片脚の膝をゆっくり伸ばして戻す"></figure><figure><figcaption>すねの外側を膝の少し下から足首へなでる</figcaption><img src="../public/care-movements/line-spleen-st-shin-stroke.svg" alt="すねの外側を膝の少し下から足首へなでる"></figure></main></html>
